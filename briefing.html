<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plano inteligente — IDAI Creative</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css"></head><body><div class="page-loader"><img src="assets/idai-triangle.png" alt=""></div><div data-public-header></div><main><section class="page-hero"><div class="shell"><span class="eyebrow">Briefing inteligente IDAI</span><h1>Descreve a visão. Nós organizamos o caminho.</h1><p>Responde às perguntas e recebe um primeiro plano ajustado à tua empresa. Depois, envia o briefing diretamente à nossa equipa pelo WhatsApp.</p></div></section>
<section class="section"><div class="shell"><form id="briefing-form" class="form-card"><div class="form-grid"><div class="field"><label for="clientName">Nome do responsável *</label><input id="clientName" name="clientName" required></div><div class="field"><label for="company">Nome da empresa *</label><input id="company" name="company" required></div><div class="field"><label for="phone">Telefone/WhatsApp *</label><input id="phone" name="phone" required placeholder="+244 ..."></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email"></div><div class="field"><label for="sector">Setor de atividade *</label><input id="sector" name="sector" required placeholder="Ex.: imobiliária, restauração, moda"></div><div class="field"><label for="stage">Fase atual da empresa</label><select id="stage" name="stage"><option value="inicio">A começar</option><option value="organizacao">Já vende, precisa de organização</option><option value="crescimento">Em crescimento</option><option value="expansao">Preparada para expansão</option></select></div><div class="field full"><label for="need">O que a empresa precisa transformar agora? *</label><textarea id="need" name="need" required placeholder="Descreve os desafios da marca, comunicação, vendas e operação..."></textarea></div><div class="field full"><label for="vision">Como imaginas a empresa daqui a quatro anos? *</label><textarea id="vision" name="vision" required placeholder="Mercado, clientes, equipa, presença e dimensão desejada..."></textarea></div><div class="field full"><label for="digitalGoals">Quais objetivos pretendes atingir no digital? *</label><textarea id="digitalGoals" name="digitalGoals" required placeholder="Ex.: aumentar seguidores qualificados, gerar leads, vender mais, fortalecer reputação..."></textarea></div><div class="field"><label for="channels">Canais prioritários</label><select id="channels" name="channels"><option>Instagram e Facebook</option><option>Instagram, Facebook e LinkedIn</option><option>TikTok e Instagram</option><option>Multicanal</option></select></div><div class="field"><label for="budget">Orçamento mensal disponível</label><select id="budget" name="budget"><option value="low">Até 60.000 Kz</option><option value="medium">60.000–100.000 Kz</option><option value="high">100.000–150.000 Kz</option><option value="enterprise">Acima de 150.000 Kz</option></select></div><div class="field full"><label><input type="checkbox" required style="width:auto"> Autorizo a IDAI Creative a utilizar estes dados para preparar a proposta e entrar em contacto.</label></div></div><button id="generate" class="btn" type="submit" style="margin-top:22px">Gerar o meu plano</button><div id="result" class="result" aria-live="polite"></div></form></div></section></main><div data-public-footer></div><script src="config.js"></script><script src="site-components.js"></script><script src="app.js"></script><script src="briefing.js"></script></body></html>
